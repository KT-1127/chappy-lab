<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チャッピー学習｜チャレンジ（お試し版）</title>
<script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
<script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
<script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
<script src="https://unpkg.com/blockly/msg/ja.js"></script>
<style>
  :root{
    --bg:#EDF2F7; --surface:#FFFFFF; --ink:#1E2A38; --sub:#5B6B7E;
    --line:#DCE4EE; --teal:#0FB5AA; --teal-soft:#E2F6F4; --teal-d:#0A8F86;
    --blue:#2F6FB0; --blue-deep:#24527F; --amber:#F5B301;
    --coral:#E8604C; --face:#14181F; --eye:#FFFFFF; --gold:#F5B301;
    --ok:#2FA95F; --ng:#E8604C; --lock:#B7C0CC;
    --radius:16px; --shadow:0 2px 12px rgba(30,42,56,.08);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:var(--bg); color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden; }

  /* Web版バナー */
  .web-banner{
    background:#1D4ED8; color:#fff; text-align:center;
    font-size:13px; font-weight:700; padding:6px 12px; flex:none;
    border-bottom:2px solid #1e40af;
  }

  /* ヘッダー：エディターと同じ濃い青グラデ */
  header{ background:linear-gradient(120deg,var(--blue-deep),var(--blue));
    color:#fff; padding:10px 18px; display:flex; align-items:center; gap:16px; }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:17px; }
  .brand .logo{ width:30px; height:30px; border-radius:8px; background:var(--face);
    display:grid; place-items:center; flex:none; }
  .brand .logo::before{ content:""; width:14px; height:5px; border-radius:3px;
    background:var(--eye); box-shadow:0 0 6px var(--eye); }
  header .chapter{ font-size:13px; color:#fff; font-weight:700;
    background:rgba(255,255,255,.18); padding:4px 12px; border-radius:999px; }
  nav{ display:flex; gap:8px; margin-left:auto; align-items:center; }
  nav a{ color:#fff; text-decoration:none; font-size:13px; font-weight:700;
    padding:7px 14px; border-radius:999px; border:1.5px solid rgba(255,255,255,.45); }
  nav a.here{ background:#fff; color:var(--blue-deep); border-color:#fff; }

  /* ログイン画面 */
  .login{ position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#24527F,#2F6FB0); }
  .login.hide{ display:none; }
  .loginbox{ background:#fff; border-radius:20px; padding:30px 28px; width:min(360px,90vw); text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.3); }
  .loginlogo{ margin-bottom:8px; }
  .loginlogo .logo{ display:inline-grid; place-items:center; width:44px; height:44px; border-radius:12px; background:var(--face); }
  .loginlogo .logo::before{ content:""; width:20px; height:7px; border-radius:4px; background:var(--eye); box-shadow:0 0 8px var(--eye); }
  .loginbox h1{ font-size:19px; margin:6px 0 2px; }
  .loginbox p{ color:var(--sub); font-size:13px; margin:0 0 16px; font-weight:700; }
  .loginbox input,.loginbox select{ width:100%; padding:12px 14px; margin-bottom:10px; border:2px solid var(--line);
    border-radius:12px; font-size:15px; font-family:inherit; box-sizing:border-box; }
  .loginbox input:focus,.loginbox select:focus{ outline:none; border-color:var(--teal); }
  .loginbox select{ font-family:inherit; }
  .loginbtn{ width:100%; background:var(--coral); color:#fff; padding:13px; font-size:16px; margin-top:2px; }
  .loginmsg{ color:var(--coral); font-size:13px; font-weight:800; min-height:18px; margin-top:8px; }
  .loginnote{ color:var(--sub); font-size:11.5px; margin-top:10px; line-height:1.5; }
  header .who{ font-size:13px; color:#fff; font-weight:800; background:rgba(255,255,255,.18); padding:4px 12px; border-radius:999px; }

  header .prog{ font-size:13px; color:#fff; font-weight:800;
    background:rgba(255,255,255,.18); padding:4px 12px; border-radius:999px; }

  .main{ flex:1; display:grid; grid-template-columns: 1fr 340px; gap:16px; padding:16px; min-height:0; }
  .left{ display:flex; flex-direction:column; gap:12px; min-height:0; }
  .blocklyWrap{ position:relative; flex:1; border-radius:var(--radius); overflow:hidden;
    background:var(--surface); min-height:0; box-shadow:var(--shadow); }
  #blocklyDiv{ position:absolute; inset:0; }
  .zoombar{ position:absolute; right:10px; bottom:10px; z-index:5;
    display:flex; flex-direction:column; gap:6px; }
  .zoombar button{ width:38px; height:38px; border:none; border-radius:10px;
    background:var(--teal,#2AA79B); color:#fff; font-size:19px; font-weight:800;
    cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.18); line-height:1; }
  .zoombar button:hover{ filter:brightness(1.08); }

  .bottombar{ display:flex; align-items:center; gap:10px; }
  .btn{ border:0; border-radius:12px; padding:11px 20px; font-size:15px; font-weight:800; cursor:pointer; font-family:inherit; }
  .btn-check{ background:var(--coral); color:#fff; box-shadow:0 3px 10px rgba(232,96,76,.35); }
  .btn-hint{ background:var(--amber); color:#5A4600; }
  .btn-run{ background:var(--blue); color:#fff; }
  .result{ font-weight:800; font-size:14px; }
  .result.ok{ color:var(--teal); }
  .result.ng{ color:var(--coral); }

  .right{ display:flex; flex-direction:column; gap:12px; min-height:0; overflow-y:auto; padding-right:2px; }
  /* Chromebook など、縦が短い画面（16:9）向けの調整 */
  @media (max-height: 800px){
    .main{ grid-template-columns: 1fr 300px; gap:12px; padding:10px; }
    .right{ gap:8px; }
    .card{ padding:12px 14px; }
    .livefaceBig{ max-height:150px; }
    .livebig{ margin-top:6px; }
    .rowbtns .btn{ padding:8px 6px; font-size:13px; }
    .stepno{ font-size:12px; }
    h3#stepTitle{ font-size:17px; margin:4px 0; }
  }
  @media (max-height: 680px){
    .livefaceBig{ max-height:120px; }
    .main{ grid-template-columns: 1fr 280px; }
  }
  /* 横がせまい画面（Chromebookは横も1366pxが多い）向け */
  @media (max-width: 1200px){
    .main{ grid-template-columns: 1fr 300px; }
  }

  .card{ background:var(--surface); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); }
  .card h3{ margin:0 0 8px; font-size:15px; }
  .card h2sub{ }
  .goalface{ width:100%; aspect-ratio:1/1;
    background:radial-gradient(120% 90% at 50% 0%, #F7FAFE 0%, #EDF3FA 100%);
    border-radius:12px; display:block; border:1px solid var(--line); }
  .tutorialbox{ margin-top:8px; background:#EFF6FF; border:2px solid #BFDBFE; border-radius:12px;
    padding:10px 12px; font-size:13px; line-height:1.9; color:#1E3A5F; display:none; }
  .tutorialbox.show{ display:block; }
  .tutorialbox .th{ font-weight:800; color:#2563EB; margin-bottom:2px; display:block; }
  .goaltext{ font-size:14px; color:var(--ink); line-height:1.6; margin-top:8px; }
  .stepno{ font-size:12px; color:var(--sub); font-weight:800; letter-spacing:.06em; }

  .steps{ overflow:auto; flex:1; }
  .steps .chap{ font-size:12px; color:var(--sub); margin:10px 4px 4px; font-weight:800; letter-spacing:.06em; }
  .steplist{ display:flex; flex-direction:column; gap:4px; }
  .step{ display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:10px; cursor:pointer; font-size:13px; background:#F4F7FA; }
  .step .n{ width:22px; height:22px; border-radius:50%; background:#DDE5EE; color:#5B6472; font-size:12px; display:flex; align-items:center; justify-content:center; font-weight:800; flex:none; }
  .step.done{ background:var(--teal-soft); }
  .step.done .n{ background:var(--teal); color:#fff; }
  .step.cur{ outline:2px solid var(--teal); }
  .step.locked{ opacity:.45; cursor:not-allowed; }
  .step .t{ flex:1; }

  .live{ display:flex; align-items:center; gap:12px; }
  .liveface{ width:120px; height:120px;
    background:radial-gradient(120% 90% at 50% 0%, #F7FAFE 0%, #EDF3FA 100%);
    border-radius:12px; flex:none; border:1px solid var(--line); }
  .livehint{ font-size:12px; color:var(--sub); font-weight:700; }

  .livebig{ margin-top:10px; }
  .livefaceBig{ width:100%; max-height:230px; aspect-ratio:1/1;
    background:radial-gradient(120% 90% at 50% 0%, #F7FAFE 0%, #EDF3FA 100%);
    border-radius:14px; display:block; border:2px solid var(--teal-soft); }
  .livecap{ text-align:center; font-size:12px; color:var(--teal-d); font-weight:800; margin-top:6px; }
  .livehint{ font-size:13px; font-weight:800; color:#B45309; background:#FFF7ED;
    border:1px dashed #FDBA74; border-radius:10px; padding:7px 10px; margin-top:6px;
    opacity:0; max-height:0; overflow:hidden; transition:opacity .25s, max-height .25s; }
  .livehint.show{ opacity:1; max-height:80px; }
  .pvindicator{ display:flex; gap:8px; justify-content:center; margin-top:6px; min-height:0; }
  .pvindicator span{ font-size:12px; font-weight:800; padding:4px 10px; border-radius:999px; }
  .pvindicator .ledon{ background:#FFF3C4; color:#8A6D00; }
  .pvindicator .fanon{ background:#DDF3FF; color:#0A6E9E; }
  .pvcontrols{ margin-top:8px; display:flex; flex-direction:column; gap:6px; }
  .pvbtn{ padding:9px; border:2px solid var(--teal); background:#fff; color:var(--teal-d);
    border-radius:12px; font-weight:800; font-size:14px; cursor:pointer; font-family:inherit; user-select:none; }
  .pvbtn.pressed{ background:var(--teal); color:#fff; }
  .pvslider{ background:#F4F8FC; border-radius:10px; padding:6px 10px; }
  .pvslider label{ font-size:12px; font-weight:800; color:var(--sub); display:flex; justify-content:space-between; }
  .pvslider input{ width:100%; }
  .pvends{ display:flex; justify-content:space-between; font-size:11px; font-weight:800; color:var(--sub); margin-top:2px; }
  .btn-run.running{ background:var(--coral); }
  .btn-save{ background:var(--teal-soft); color:var(--teal-d); }
  .savemark{ font-size:13px; font-weight:800; color:var(--teal); opacity:0; transition:opacity .3s; margin-left:6px; }
  .savemark.show{ opacity:1; }
  .sendbox{ margin-left:auto; display:flex; align-items:center; gap:8px; }
  .device-sel{ padding:9px 10px; border:2px solid var(--line); border-radius:10px; font-size:13px; font-weight:800; font-family:inherit; background:#fff; color:var(--ink); cursor:pointer; }
  .btn-send{ background:var(--coral); color:#fff; box-shadow:0 3px 10px rgba(232,96,76,.35); }
  .btn-send:disabled{ background:#aaa; box-shadow:none; cursor:not-allowed; opacity:.7; }
  .send-status{ font-size:13px; font-weight:800; }
  .send-status.ok{ color:var(--teal); } .send-status.err{ color:var(--coral); }
  .rowbtns{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .rowbtns .btn{ padding:12px 8px; font-size:14px; white-space:nowrap; }
  .btn-goal{ background:var(--blue); color:#fff; }
  .btn-list{ background:#E2E9F2; color:#3D4C5E; }
  .btn-intro{ background:var(--teal-soft); color:var(--teal-d); }
  .introgoal{ display:flex; align-items:center; gap:12px; margin:8px 0 4px; text-align:left; }
  .introgoal .goalfaceModal{ width:110px; height:110px; margin:0; flex:none; }
  .introgoaltext{ font-size:15px; color:var(--ink); line-height:1.6; font-weight:700; }
  .goalpill{ display:inline-block; background:var(--coral); color:#fff; font-weight:800;
    font-size:14px; padding:4px 14px; border-radius:999px; margin-bottom:6px; }
  .introgoal{ background:#FFF6F4; border:2px solid #FBD9D1; border-radius:14px; padding:12px; }
  .introitem{ display:flex; gap:12px; align-items:flex-start; text-align:left;
    background:#F4F8FC; border-radius:12px; padding:12px; margin-top:10px; }
  .introitem{ align-items:center; }
  .blockprev{ flex:none; min-width:120px; height:56px; background:#FBFDFF; border-radius:10px; border:1px solid var(--line); position:relative; overflow:hidden; }
  .introitem .txt{ flex:1; }
  .introitem .nm{ font-weight:800; font-size:14px; margin-bottom:2px; }
  .introitem .ds{ font-size:13px; color:var(--sub); line-height:1.5; }
  .boxwide{ width:min(460px,92vw); text-align:left; }
  .stepshost{ max-height:60vh; overflow:auto; margin:10px 0; }
  .btn-close{ background:var(--teal); color:#fff; margin-top:14px; }
  .goalfaceModal{ width:200px; height:200px;
    background:radial-gradient(120% 90% at 50% 0%, #F7FAFE 0%, #EDF3FA 100%);
    border-radius:14px; margin:6px auto; display:block; border:1px solid var(--line); }
  .hintbox{ margin-top:8px; font-size:13px; background:#FFF9EC; border:1px dashed var(--amber); border-radius:10px; padding:10px; color:#7A611A; display:none; }
  .hintbox.show{ display:block; }
  .modal{ position:fixed; inset:0; background:rgba(20,30,50,.5); display:none; align-items:center; justify-content:center; z-index:50; }
  .modal.show{ display:flex; }
  .modal .box{ background:#fff; border-radius:18px; padding:24px; width:min(420px,90vw); text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.3); }
  .modal .big{ font-size:48px; }
  .modal h2{ margin:6px 0; }
  .modal p{ color:var(--sub); font-size:14px; }
  .modal .btn{ margin-top:14px; background:var(--teal); color:#fff; }
  .encourage{ font-size:13px; color:var(--teal-d); margin-top:8px; background:var(--teal-soft); padding:10px; border-radius:10px; }
  .modal .btn-retry{ margin-top:14px; background:var(--amber); color:#5A4600; }
  #loopArt{ margin:10px auto 0; }
  #loopModal .box{ width:min(420px,92vw); }
  .ngtip{ font-size:13px; color:#7A611A; margin-top:8px; background:#FFF9EC; border:1px dashed var(--amber); padding:10px; border-radius:10px; }
</style>
</head>
<body>

<!-- Web版バナー -->
<div class="web-banner">
  🌐 お試し版 ─ ログイン不要で全課題プレイ可能。実機送信・進捗サーバー保存は使えません。
</div>

<header>
  <div class="brand"><span class="logo"></span>チャッピーラボ</div>
  <div class="chapter" id="chapterLabel">第1章 基本の命令</div>
  <nav>
    <a href="editor.html">① つくる</a>
    <a href="dashboard.html">② みる</a>
    <a class="here" href="learn.html">③ まなぶ</a>
  </nav>
  <div class="who" id="whoLabel">お試し版</div>
  <div class="prog" id="progLabel">クリア 0 / 0</div>
</header>

<div class="main">
  <div class="left">
    <div class="blocklyWrap"><div id="blocklyDiv"></div>
      <div class="zoombar">
        <button type="button" id="zin"  title="大きく">＋</button>
        <button type="button" id="zout" title="小さく">－</button>
        <button type="button" id="zrst" title="もとの大きさ">⟲</button>
      </div>
    </div>
    <div class="bottombar">
      <button class="btn btn-check" id="checkBtn">✓ 答え合わせ</button>
      <button class="btn btn-save" id="saveBtn">💾 保存</button>
      <button class="btn btn-run" id="runBtn">▶ ためす</button>
      <span class="result" id="result"></span>
      <span class="savemark" id="saveMark">✓ 保存しました</span>
      <span class="sendbox">
        <select id="deviceSel" class="device-sel" title="どのチャッピーに送るか">
          <option value="stackchan-01">1号機</option>
          <option value="stackchan-02">2号機</option>
          <option value="stackchan-03">3号機</option>
          <option value="stackchan-04">4号機</option>
          <option value="stackchan-05">5号機</option>
          <option value="stackchan-06">6号機</option>
          <option value="stackchan-07">7号機</option>
          <option value="stackchan-08">8号機</option>
        </select>
        <button class="btn btn-send" id="sendBtn" disabled>🚀 実機に送る</button>
        <span class="send-status" id="sendStatus"></span>
      </span>
    </div>
  </div>

  <div class="right">
    <div class="card">
      <div class="stepno" id="stepNo">だい 1 もん</div>
      <h3 id="stepTitle">笑顔にしよう</h3>
      <div class="goaltext" id="goalText"></div>
      <div class="tutorialbox" id="tutorialBox"></div>
      <div class="livebig">
        <svg class="livefaceBig" id="liveFace" viewBox="0 0 220 220"></svg>
        <div class="livecap">▲ キミのプログラムの動き</div>
        <div class="livehint" id="liveHint"></div>
        <div class="pvindicator" id="pvIndicator"></div>
        <div class="pvcontrols" id="pvControls"></div>
      </div>
      <div class="rowbtns">
        <button class="btn btn-goal" id="goalBtn">🎯 お手本</button>
        <button class="btn btn-hint" id="hintBtn">💡 ヒント</button>
        <button class="btn btn-list" id="listBtn">📋 もんだい一覧</button>
        <button class="btn btn-intro" id="introBtn">📖 説明</button>
      </div>
      <div class="hintbox" id="hintBox"></div>
    </div>
  </div>
</div>

<!-- もんだい一覧モーダル -->
<div class="modal" id="listModal">
  <div class="box boxwide">
    <div class="stepno">📋 もんだい一覧</div>
    <div id="stepsHost" class="stepshost"></div>
    <button class="btn btn-close" id="listCloseBtn">とじる</button>
  </div>
</div>

<!-- 説明モーダル（新しい要素の説明＋ゴール） -->
<div class="modal" id="introModal">
  <div class="box boxwide">
    <div class="stepno" id="introStepNo"></div>
    <h2 id="introTitle"></h2>
    <div class="introgoal">
      <svg class="goalfaceModal" id="introGoalFace" viewBox="0 0 220 220"></svg>
      <div class="introgoaltext" id="introGoalText"></div>
    </div>
    <div id="introItems"></div>
    <button class="btn btn-close" id="introCloseBtn">やってみる！</button>
  </div>
</div>

<!-- お手本モーダル -->
<div class="modal" id="goalModal">
  <div class="box">
    <div class="stepno">🎯 お手本（ゴールのすがた）</div>
    <h2 id="goalModalTitle"></h2>
    <svg class="goalfaceModal" id="goalFace" viewBox="0 0 220 220"></svg>
    <p id="goalModalText"></p>
    <button class="btn btn-close" id="goalCloseBtn">とじる</button>
  </div>
</div>

<div class="modal" id="clearModal">
  <div class="box">
    <div class="big">🎉</div>
    <h2 id="clearTitle">せいかい！</h2>
    <p id="clearMsg">よくできました！</p>
    <div class="encourage" id="clearEnc"></div>
    <button class="btn btn-check" id="nextBtn">つぎの もんだいへ →</button>
  </div>
</div>

<!-- ざんねんモーダル（不正解） -->
<div class="modal" id="ngModal">
  <div class="box">
    <div class="big">🤔</div>
    <h2>おしい！</h2>
    <p id="ngMsg"></p>
    <div class="ngtip" id="ngTip"></div>
    <button class="btn btn-retry" id="retryBtn">もう一度やってみる</button>
  </div>
</div>

<!-- ループ警告モーダル（ためすを押したとき） -->
<div class="modal" id="loopModal">
  <div class="box">
    <div class="big">🔁</div>
    <h2>ループに入れてね！</h2>
    <p>いまのプログラムは、<b>1回チェックしたらすぐ終わって</b>しまうよ。<br>
       センサーをずっと見張るには、<br><b>「🔁 ずっとくりかえす」</b>の中に入れよう。<br>
       （本物のチャッピーも同じだよ）</p>
    <div class="loopart" id="loopArt"></div>
    <button class="btn btn-retry" id="loopCloseBtn">なおしてみる</button>
  </div>
</div>

<script>
/* ============================================================
   チャッピー学習システム（Web版 / お試し版）
   - サーバー不要・GitHub Pages対応
   - ログイン不要・全課題アンロック
   - 進捗はlocalStorageに保存
   ============================================================ */

/* ---------- ブロック定義（エディタと同じセット） ---------- */
Blockly.defineBlocksWithJsonArray([
  { type:'sc_face', message0:'😀 表情を %1 にする',
    args0:[{ type:'field_dropdown', name:'FACE', options:[
      ['ふつう','neutral'],['笑顔','happy'],['かなしい','sad'],
      ['おこり','angry'],['ねむい','sleepy'],['びっくり','doubt'] ]}],
    previousStatement:null, nextStatement:null, colour:16 },
  { type:'sc_speak', message0:'💬 %1 としゃべる',
    args0:[{ type:'field_input', name:'TEXT', text:'こんにちは' }],
    previousStatement:null, nextStatement:null, colour:16 },
  { type:'sc_color', message0:'🎨 目と口の色を %1 にする',
    args0:[{ type:'field_dropdown', name:'COLOR', options:[
      ['しろ','white'],['あか','red'],['あお','blue'],['みどり','green'],
      ['きいろ','yellow'],['ピンク','pink'],['むらさき','purple'] ]}],
    previousStatement:null, nextStatement:null, colour:16 },

JS.forBlock['sc_distance']= ()=>['sim.s.distance',ORD];
JS.forBlock['sc_light']   = ()=>['sim.s.light',ORD];
JS.forBlock['sc_temp']    = ()=>['sim.s.temp',ORD];
JS.forBlock['sc_pir']     = ()=>['sim.s.pir',ORD];

};

/* ---------- シミュレーター実行エンジン（判定の心臓部） ---------- */
function makeSim(inputs){
  const s = Object.assign({ light:300, distance:30, temp:25, pir:false, button_red:false, button_blue:false, sound:40 }, inputs||{});
  const sim = {
    s,
    out:{ face:'neutral', speech:'', color:'white', pan:90, tilt:45, led:false, fan:false, aiCalled:false },
    trace:[],
    face(f){ this.out.face=f; this.trace.push({t:'face',v:f}); },
    speak(x){ this.out.speech=x; this.trace.push({t:'speak',v:x}); },
    color(c){ this.out.color=c; this.trace.push({t:'color',v:c}); },
    led(on){ this.out.led=!!on; this.trace.push({t:'led',v:!!on}); },
    fan(on){ this.out.fan=!!on; this.trace.push({t:'fan',v:!!on}); },
    pan(d){ this.out.pan=+d; this.trace.push({t:'pan',v:+d}); },
    tilt(d){ this.out.tilt=+d; this.trace.push({t:'tilt',v:+d}); },
    wait(sec){ this.trace.push({t:'wait',v:+sec}); },
    ai(p){ this.out.aiCalled=true; this.trace.push({t:'ai',v:p}); },
  };
  return sim;
}
// 生徒プログラムを、指定入力で実行して結果を返す
function runProgram(code, inputs){
  const sim = makeSim(inputs);
  try { (new Function('sim', code))(sim); }
  catch(e){ return { error:String(e), out:sim.out, trace:sim.trace }; }
  return { out:sim.out, trace:sim.trace };
}
// trace の中に、ある命令が含まれるか
function traceHas(trace, t, v){
  return trace.some(x => x.t===t && (v===undefined || x.v===v));
}
function traceIndex(trace, t, v){
  return trace.findIndex(x => x.t===t && (v===undefined || x.v===v));
}

const COLOR_HEX={ white:'#FFFFFF', black:'#FFFFFF', red:'#FF5A5A', blue:'#39D6E8', green:'#5AE07A', yellow:'#FFD23F', pink:'#FF7FB6', purple:'#B98CFF' };
function drawFace(svg, st){
  const eye = COLOR_HEX[st.color]||'#FFFFFF';
  const eyeL=svg.querySelector('.eyeL'), eyeR=svg.querySelector('.eyeR');
  const mouth=svg.querySelector('.mouth');
  const browL=svg.querySelector('.browL'), browR=svg.querySelector('.browR');
  const head=svg.querySelector('.head');
  [eyeL,eyeR].forEach(e=>e.setAttribute('fill',eye));
  [mouth,browL,browR].forEach(e=>e.setAttribute('stroke',eye));
  browL.setAttribute('d',''); browR.setAttribute('d','');
  eyeL.setAttribute('r','15'); eyeR.setAttribute('r','15');
  eyeL.setAttribute('cy','72'); eyeR.setAttribute('cy','72');
  const f=st.face;
  if (f==='happy'){
    mouth.setAttribute('d','M 76 110 Q 110 140 144 110');
    eyeL.setAttribute('cy','70'); eyeR.setAttribute('cy','70');
  } else if (f==='sad'){
    mouth.setAttribute('d','M 76 126 Q 110 102 144 126');
    browL.setAttribute('d','M 62 58 L 88 48'); browR.setAttribute('d','M 158 58 L 132 48');
  } else if (f==='angry'){
    mouth.setAttribute('d','M 78 124 Q 110 112 142 124');
    browL.setAttribute('d','M 62 50 L 88 60'); browR.setAttribute('d','M 158 50 L 132 60');
  } else if (f==='sleepy'){
    mouth.setAttribute('d','M 88 118 Q 110 124 132 118');
    eyeL.setAttribute('r','5'); eyeR.setAttribute('r','5');
  } else if (f==='doubt'){
    mouth.setAttribute('d','M 80 120 Q 110 112 140 124');
    browL.setAttribute('d','M 62 50 L 88 56'); browR.setAttribute('d','M 158 56 L 132 48');
  } else {
    mouth.setAttribute('d','M 78 116 Q 110 116 142 116');
  }
  const rot=(st.pan-90)/3, dy=(45-st.tilt)*0.4;
  head.setAttribute('transform','translate(0 '+dy+') rotate('+rot+' 110 88)');
  const say=svg.querySelector('.say'); say.textContent=st.speech? '「'+st.speech+'」':'';
}

function workspaceXml(){
  try{
    if(Blockly.serialization && Blockly.serialization.workspaces){
      const j = Blockly.serialization.workspaces.save(workspace);
      return 'JSON:' + JSON.stringify(j);
    }
  }catch(e){}
  try{
    const dom = Blockly.Xml.workspaceToDom(workspace);
    const toText = (Blockly.Xml.domToText) || (Blockly.utils && Blockly.utils.xml && Blockly.utils.xml.domToText);
    return toText ? toText(dom) : '';
  }catch(e){ return ''; }
}

let restoring = false;
function restoreWork(qid){
  // Web版: localStorageから読み込む
  let data = studentWorks[qid];
  if(!data){
    try{ data = localStorage.getItem('sclab_work_'+qid); }catch(e){}
  }
  if(!data) return false;
  try{
    restoring = true;
    workspace.clear();
    if(typeof data === 'string' && data.indexOf('JSON:') === 0){
      Blockly.serialization.workspaces.load(JSON.parse(data.slice(5)), workspace);
    } else {
      const toDom = (Blockly.utils && Blockly.utils.xml && Blockly.utils.xml.textToDom) || Blockly.Xml.textToDom;
      Blockly.Xml.domToWorkspace(toDom(data), workspace);
    }
    restoring = false;
    return true;
  }catch(e){ restoring = false; return false; }
}

/* ---------- 音声（Web Speech API） ---------- */
function playSay(text){
  return new Promise(res=>{
    if(!window.speechSynthesis){ res(); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.rate = 1.1;
    u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
    setTimeout(res, 4000); // タイムアウト保険
  });
}

function evalValue(b){
  if(!b) return 0;
  const t=b.type;
  if(t==='sc_light') return pv.light;
  if(t==='sc_distance') return pv.distance;
  if(t==='sc_temp') return pv.temp;
  if(t==='sc_pir') return pv.pir?1:0;
  if(t==='sc_button_red') return pv.button_red?1:0;
  if(t==='sc_button_blue') return pv.button_blue?1:0;
  if(t==='math_number') return Number(b.getFieldValue('NUM'));
  return 0;
}
function evalBool(b){
  if(!b) return false;
  const t=b.type;
  if(t==='sc_pir') return !!pv.pir;
  if(t==='sc_button_red') return !!pv.button_red;
  if(t==='sc_button_blue') return !!pv.button_blue;
  if(t==='sc_and') return evalBool(b.getInputTargetBlock('A')) && evalBool(b.getInputTargetBlock('B'));
  if(t==='logic_boolean') return b.getFieldValue('BOOL')==='TRUE';
  if(t==='logic_compare'){
    const a=evalValue(b.getInputTargetBlock('A')), c=evalValue(b.getInputTargetBlock('B'));
    switch(b.getFieldValue('OP')){
      case 'EQ':return a===c; case 'NEQ':return a!==c;
      case 'LT':return a<c; case 'LTE':return a<=c;
      case 'GT':return a>c; case 'GTE':return a>=c;
    }
  }
  return false;
}

async function execStack(block, st, my){
  while(block){
    if(runToken!==my) return;
    await execBlock(block, st, my);
    if(runToken!==my) return;
    block=block.getNextBlock();
  }
}
async function execBlock(b, st, my){
  const t=b.type;
  if(t==='sc_face'){ st.face=b.getFieldValue('FACE'); paint(st); await sleep(120); }
  else if(t==='sc_speak'){ const x=b.getFieldValue('TEXT'); st.speech=x; paint(st); await maybeSay(x); st.speech=''; paint(st); }
  else if(t==='sc_color'){ st.color=b.getFieldValue('COLOR'); paint(st); await sleep(120); }
  else if(t==='sc_led'){ st.led=(b.getFieldValue('STATE')==='on'); paint(st); await sleep(120); }
  else if(t==='sc_fan'){ st.fan=(b.getFieldValue('STATE')==='on'); paint(st); await sleep(120); }
  else if(t==='sc_pan'){ st.pan=Number(b.getFieldValue('DEG')); paint(st); await sleep(300); }
  else if(t==='sc_tilt'){ st.tilt=Number(b.getFieldValue('DEG')); paint(st); await sleep(300); }
  else if(t==='sc_wait'){ await sleep(Number(b.getFieldValue('SEC'))*1000); }
  else if(t==='sc_ai'){ st.face='happy'; st.speech='🤖 実機に送って話してみてね！'; paint(st); await sleep(1600); st.speech=''; paint(st); }
  else if(t==='sc_forever'){
    const body=b.getInputTargetBlock('DO');
    while(runToken===my){ await execStack(body, st, my); await sleep(body?60:250); }
  }
  else if(t==='controls_repeat_ext'){
    const nb=b.getInputTargetBlock('TIMES'); const n=nb?Number(nb.getFieldValue('NUM')):0;
    const body=b.getInputTargetBlock('DO');
    for(let i=0;i<n && runToken===my;i++){ await execStack(body, st, my); }
  }
  else if(t==='controls_if'){
    let done=false, i=0;
    while(true){
      const cond=b.getInputTargetBlock('IF'+i);
      if(!cond && i>0) break;
      if(cond===undefined) break;
      if(cond===null && i===0){ break; }
      if(cond && evalBool(cond)){ await execStack(b.getInputTargetBlock('DO'+i), st, my); done=true; break; }
      i++;
      if(i>5) break;
    }
    if(!done){ const el=b.getInputTargetBlock('ELSE'); if(el) await execStack(el, st, my); }
  }
}

async function runPreview(){
  const c=CH[cur];
  if(c.needLoop){
    const inside=typesInsideForever();
    const need=(c.id===8)?'sc_face':'controls_if';
    const topHasForever = workspace.getAllBlocks(false).some(b=>b.type==='sc_forever' && b.getInputTargetBlock('DO'));
    if(!inside.has(need)){
      showLoopWarn();
      return;
    }
  }
  const my=++runToken;
  const st={ face:'neutral', speech:'', color:'white', pan:90, tilt:45 };
  paint(st);
  const btn=document.getElementById('runBtn');
  btn.textContent='⏹ とめる'; btn.classList.add('running');
  const top=workspace.getTopBlocks(true)[0];
  if(top){ await execStack(top, st, my); }
  if(runToken===my){ btn.textContent='▶ ためす'; btn.classList.remove('running'); }
}
function stopPreview(){
  runToken++;
  const btn=document.getElementById('runBtn');
  if(btn){ btn.textContent='▶ ためす'; btn.classList.remove('running'); }
}
function clearPreview(){
  stopPreview();
  drawFace(document.getElementById('liveFace'), { face:'neutral', speech:'', color:'white', pan:90, tilt:45 });
}

/* ============================================================
   課題の読み込み
   ============================================================ */
function loadChallenge(i){
  cur=i; const c=CH[i];
  document.getElementById('chapterLabel').textContent = '第'+chapterNo(c.chapter)+'章 '+c.chapter;
  document.getElementById('stepNo').textContent = 'だい '+c.id+' もん';
  document.getElementById('stepTitle').textContent = c.title;
  document.getElementById('goalText').textContent = c.goal;
  const tb=document.getElementById('tutorialBox');
  if(tb){
    if(c.tutorial && c.tutorial.length){
      tb.innerHTML='<span class="th">📘 やってみよう</span>'+c.tutorial.join('<br>');
      tb.classList.add('show');
    } else { tb.classList.remove('show'); tb.innerHTML=''; }
  }
  document.getElementById('result').textContent='';
  document.getElementById('result').className='result';
  const hb=document.getElementById('hintBox'); hb.textContent=c.hint; hb.classList.remove('show');

  workspace.updateToolbox(toolboxFor(c.tools));
  workspace.clear();
  // 前に作った作品があれば復元
  restoreWork(c.id);

  clearPreview();
  buildControls();
  renderSteps();
  openIntro(true);
}

/* ---------- 説明モーダル ---------- */
let previewWS=[];
let introSeq=0;
function disposePreviews(){ previewWS.forEach(w=>{try{w.dispose();}catch(e){}}); previewWS=[]; }
function renderBlockPreview(holderId, type){
  const holder=document.getElementById(holderId); if(!holder) return;
  const ws=Blockly.inject(holder, {
    readOnly:true, theme:window.__sclabTheme, renderer:'zelos',
    scrollbars:false, trashcan:false, sounds:false,
  });
  previewWS.push(ws);
  let b;
  if(type==='controls_ifelse'){
    b=ws.newBlock('controls_if');
    try{ b.loadExtraState && b.loadExtraState({hasElse:true}); }catch(e){}
  } else {
    b=ws.newBlock(type);
  }
  b.initSvg(); b.render();
  const bb=b.getSvgRoot().getBBox();
  holder.style.width=Math.min(bb.width+16,260)+'px';
  holder.style.height=(bb.height+16)+'px';
  b.moveBy(8,8);
  Blockly.svgResize(ws);
}
let introDemoTimer=null;
function openIntro(auto){
  const c=CH[cur]; const info=INTRO[c.id];
  document.getElementById('introStepNo').textContent='だい '+c.id+' もん';
  document.getElementById('introTitle').textContent=(info&&info.title)||c.title;
  document.getElementById('introGoalText').innerHTML='<span class="goalpill">🎯 ゴール</span><br>'+c.goal;
  const svg=document.getElementById('introGoalFace');
  clearInterval(introDemoTimer);
  const start=Date.now();
  introDemoTimer=setInterval(()=>{
    const sec=(Date.now()-start)/1000, phase=Math.floor(sec/1.2)%2===0;
    const sim=makeSim({});
    try{ if(c.demo.length>=2) c.demo(sim,phase); else c.demo(sim);}catch(e){}
    drawFace(svg,sim.out);
  },120);
  const host=document.getElementById('introItems'); host.innerHTML='';
  disposePreviews();
  introSeq++;
  const seq=introSeq;
  const toRender=[];
  if(info&&info.items){ info.items.forEach((it,idx)=>{
    const el=document.createElement('div'); el.className='introitem';
    const holderId='bp_'+seq+'_'+idx;
    el.innerHTML='<div class="blockprev" id="'+holderId+'"></div>'+
      '<div class="txt"><div class="nm">'+it.name+'</div><div class="ds">'+it.desc+'</div></div>';
    host.appendChild(el);
    if(it.block) toRender.push([holderId, it.block]);
  }); }
  document.getElementById('introModal').classList.add('show');
  requestAnimationFrame(()=>{ if(seq!==introSeq) return;
    toRender.forEach(([hid,btype])=>renderBlockPreview(hid, btype));
  });
}
function closeIntro(){ document.getElementById('introModal').classList.remove('show'); document.getElementById('listModal').classList.remove('show'); clearInterval(introDemoTimer); }

function openGoal(){
  const c=CH[cur];
  document.getElementById('goalModalTitle').textContent=c.title;
  document.getElementById('goalModalText').textContent=c.goal;
  document.getElementById('goalModal').classList.add('show');
  startGoalDemo();
}
function closeGoal(){
  document.getElementById('goalModal').classList.remove('show');
  stopGoalDemo();
}
function chapterNo(name){
  const chaps=['基本の命令','うごき','くりかえし','センサーと判断','いろんなセンサー','連動・応用','温度センサー','人感・複合センサー','アクチュエータ','ボタンスイッチ','挑戦'];
  return chaps.indexOf(name)+1;
}

/* ---------- 左のステップ一覧 ---------- */
function renderSteps(){
  const host=document.getElementById('stepsHost'); host.innerHTML='';
  let lastChap='';
  CH.forEach((c,i)=>{
    if(c.chapter!==lastChap){
      const h=document.createElement('div'); h.className='chap';
      h.textContent='第'+chapterNo(c.chapter)+'章 '+c.chapter; host.appendChild(h);
      lastChap=c.chapter;
      const list=document.createElement('div'); list.className='steplist'; list.id='cl'+i; host.appendChild(list);
    }
    const list=host.querySelector('.steplist:last-child');
    const el=document.createElement('div'); el.className='step';
    // teacherMode = true なので全問アンロック
    const unlocked = teacherMode || i===0 || cleared.has(CH[i-1].id) || cleared.has(c.id);
    if(cleared.has(c.id)) el.classList.add('done');
    if(i===cur) el.classList.add('cur');
    if(!unlocked) el.classList.add('locked');
    el.innerHTML='<span class="n">'+(cleared.has(c.id)?'✓':c.id)+'</span><span class="t">'+c.title+'</span>';
    if(unlocked) el.onclick=()=>loadChallenge(i);
    list.appendChild(el);
  });
  const done=cleared.size;
  document.getElementById('progLabel').textContent='クリア '+done+' / '+CH.length;
}

/* ============================================================
   ボタン動作
   ============================================================ */
function typesInsideForever(){
  const set=new Set();
  workspace.getAllBlocks(false).forEach(b=>{
    if(b.type==='sc_forever'){
      const inner=b.getInputTargetBlock('DO');
      if(inner) inner.getDescendants(true).forEach(x=>set.add(x.type));
    }
  });
  return set;
}

function doCheck(){
  const c=CH[cur];
  let code=''; try{ code=JS.workspaceToCode(workspace); }catch(e){}
  if(!code.trim()){
    showNG('まだブロックが置かれていないよ。左からブロックを持ってきてね。', c);
    return;
  }
  saveWork(false);
  if(c.needLoop){
    const inside=typesInsideForever();
    const need = (c.id===8) ? 'sc_face' : 'controls_if';
    if(!inside.has(need)){
      sendProgress('attempt', c.id);
      showNG('「🔁 ずっとくりかえす」の中に入れよう！ 入れないと1回で終わってしまうよ（本物のチャッピーも同じ）。', c);
      return;
    }
  }
  let res;
  try{ res=c.check((inputs)=>runProgram(code,inputs)); }
  catch(e){ res={ok:false,msg:'プログラムにエラーがあるみたい。ブロックのつなぎ方を見てみよう。'}; }
  if(res.ok){
    cleared.add(c.id); renderSteps();
    sendProgress('clear', c.id);
    showClear(c);
  } else {
    sendProgress('attempt', c.id);
    showNG(res.msg||'もう一度考えてみよう。', c);
  }
}

function showNG(msg, c){
  document.getElementById('ngMsg').textContent = msg;
  document.getElementById('ngTip').textContent = '💡 ヒント：'+c.hint;
  document.getElementById('ngModal').classList.add('show');
}
function showResult(ok,msg){
  const r=document.getElementById('result');
  r.textContent=(ok?'✓ ':'✗ ')+msg; r.className='result '+(ok?'ok':'ng');
}
function showClear(c){
  document.getElementById('clearMsg').textContent='「'+c.title+'」クリア！';
  const enc=document.getElementById('clearEnc');
  enc.textContent = '💡 本物のチャッピーでも動かしてみよう！（ローカル版で同じプログラムを送れるよ）';
  const modal=document.getElementById('clearModal'); modal.classList.add('show');
  const nb=document.getElementById('nextBtn');
  if(cur < CH.length-1){ nb.textContent='つぎの もんだいへ →'; nb.onclick=()=>{ modal.classList.remove('show'); loadChallenge(cur+1); }; }
  else { nb.textContent='ぜんぶクリア！とじる'; nb.onclick=()=>modal.classList.remove('show'); }
}

document.getElementById('checkBtn').onclick=doCheck;
document.getElementById('saveBtn').onclick=()=>saveWork(true);
document.getElementById('sendBtn').onclick=sendToDevice;
document.getElementById('hintBtn').onclick=()=>document.getElementById('hintBox').classList.toggle('show');
document.getElementById('goalBtn').onclick=openGoal;
document.getElementById('goalCloseBtn').onclick=closeGoal;
document.getElementById('listBtn').onclick=()=>{ renderSteps(); document.getElementById('listModal').classList.add('show'); };
document.getElementById('listCloseBtn').onclick=()=>document.getElementById('listModal').classList.remove('show');
document.getElementById('retryBtn').onclick=()=>document.getElementById('ngModal').classList.remove('show');
document.getElementById('introBtn').onclick=()=>openIntro(false);
document.getElementById('loopCloseBtn').onclick=()=>{ document.getElementById('loopModal').classList.remove('show'); if(window.__loopWS){try{window.__loopWS.dispose();}catch(e){} window.__loopWS=null;} };
document.getElementById('introCloseBtn').onclick=closeIntro;
document.getElementById('runBtn').onclick=()=>{
  const btn=document.getElementById('runBtn');
  if(btn.classList.contains('running')){ stopPreview(); }
  else { runPreview(); }
};

/* ============================================================
   起動
   ============================================================ */
function initApp(){
  document.getElementById('goalFace').innerHTML=FACE_SVG;
  document.getElementById('liveFace').innerHTML=FACE_SVG;
  document.getElementById('introGoalFace').innerHTML=FACE_SVG;
  const theme = window.__sclabTheme = Blockly.Theme.defineTheme('sclab', {
    base: Blockly.Themes.Classic,
    componentStyles: {
      workspaceBackgroundColour:'#FBFDFF',
      toolboxBackgroundColour:'#EFF4FA',
      flyoutBackgroundColour:'#E7EEF6',
      flyoutOpacity:0.96,
      scrollbarColour:'#C3D0DE',
    },
    fontStyle:{ family:'"Hiragino Maru Gothic ProN","Yu Gothic UI",sans-serif', size:12 },
  });
  document.addEventListener('input', (e)=>{
    const t=e.target;
    if(t && t.classList && t.classList.contains('blocklyHtmlInput')){
      const conv=t.value.replace(/[０-９．－]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
      if(conv!==t.value){
        const p=t.selectionStart;
        t.value=conv;
        try{ t.setSelectionRange(p,p); }catch(_){}
        t.dispatchEvent(new Event('input',{bubbles:true}));
      }
    }
  }, true);
  window.addEventListener('resize', ()=>{ if(window.__ws) Blockly.svgResize(window.__ws); });
  workspace = Blockly.inject('blocklyDiv', {
    toolbox: toolboxFor(CH[0].tools), theme,
    renderer:'zelos', trashcan:false,
    grid:{ spacing:24, length:3, colour:'#E3EAF2', snap:true },
    zoom:{ controls:false, wheel:true, startScale:0.9, maxScale:2.5, minScale:0.4 },
    move:{ scrollbars:true, drag:true, wheel:true },
  });
  window.__ws=workspace;
  const _zi=document.getElementById('zin'), _zo=document.getElementById('zout'), _zr=document.getElementById('zrst');
  if(_zi) _zi.onclick=()=>workspace.zoomCenter(1);
  if(_zo) _zo.onclick=()=>workspace.zoomCenter(-1);
  if(_zr) _zr.onclick=()=>{ workspace.setScale(0.9); workspace.scrollCenter(); };
  window.addEventListener('resize', ()=>Blockly.svgResize(workspace));
  setTimeout(()=>Blockly.svgResize(workspace), 50);
  loadChallenge(0);
}

/* ============================================================
   DOMContentLoaded: ログイン画面なし・直接起動
   ============================================================ */
window.addEventListener('DOMContentLoaded', ()=>{
  // Web版: localStorageから進捗を読み込む
  loadSavedProgress();
  // teacherMode = true なので、直接initApp()を呼ぶ
  initApp();
});
